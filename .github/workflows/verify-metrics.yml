name: verify-metrics

# The gate referenced throughout metrics/registry.yaml's `verified_by`
# fields. Any change touching a metric formula, the synthetic data
# generator, or the dbt / LookML layers has to pass the golden-query,
# dbt parity, and LookML coverage tests before it can merge.

# DuckDB only, on purpose: this workflow needs no credentials. The
# Snowflake / Databricks / Redshift targets in platforms/dbt/profiles.yml
# are run by hand (see platforms/dbt/README.md); their parity tests skip
# here because DBT_PARITY_TARGET is unset.

on:
  pull_request:
    paths:
      - "metrics/**"
      - "data/generate_synthetic_data.py"
      - "tests/**"
      - "requirements.txt"
      - "platforms/dbt/**"
      - "platforms/looker/**"
      - "platforms/semantic_layer/**"
      - "scripts/**"
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt \
            -r platforms/dbt/requirements.txt \
            -r platforms/looker/requirements.txt

      - name: Build synthetic warehouse
        run: python data/generate_synthetic_data.py

      - name: Build and test dbt models
        run: dbt build --project-dir platforms/dbt --profiles-dir platforms/dbt

      - name: Run metrics registry, dbt parity, and LookML coverage tests
        env:
          REQUIRE_DBT: "1"
        run: pytest tests/ -v
