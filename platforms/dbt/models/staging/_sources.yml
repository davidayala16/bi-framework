version: 2

sources:
  - name: raw
    description: >
      Synthetic DTC e-commerce tables written by data/generate_synthetic_data.py
      into DuckDB's default schema, or loaded into a cloud
      warehouse by scripts/load_synthetic_to_warehouse.py. Fabricated with a fixed seed; no
      real company data.
    # `main` on DuckDB, `raw` on cloud targets; see macros/raw_schema.sql.
    schema: "{{ env_var('BI_FRAMEWORK_RAW_SCHEMA', 'main' if target.type == 'duckdb' else 'raw') }}"
    tables:
      - name: customers
      - name: orders
      - name: order_items
      - name: products
      - name: marketing_spend
