version: 2

# One model per metric in metrics/registry.yaml. The registry stays the
# definition of record: each model below is an implementation of a registry
# entry, linked by `meta.registry_id`, and tests/test_dbt_parity.py fails CI
# if any model's output drifts from what metrics.resolver returns for the
# same metric — or if a registry metric has no dbt model at all.
#
# `meta.semantic` is how the same metric is expressed as one aggregate over
# a dbt mart, for warehouse-native semantic layers (Snowflake semantic
# views, Databricks metric views). scripts/export_semantic_layer.py
# generates those definitions from the registry plus this mapping, and
# tests/test_semantic_layer_export.py runs every expression on DuckDB and
# fails if it disagrees with the registry. Expressions must stay portable
# SQL: they are emitted verbatim for both warehouses.
#   table     the mart the expression aggregates over
#   expr      the aggregate expression
#   group_by  registry output column -> mart column, for metrics whose
#             registry result has one row per group
#   note      optional caveat appended to the exported description

models:
  - name: metric_net_revenue
    description: Implements registry metric `net_revenue`.
    meta:
      registry_id: net_revenue
      owner: analytics-team
      semantic:
        table: fct_order_items
        expr: "ROUND(SUM(revenue), 2)"
    columns:
      - name: net_revenue
        tests: [not_null]

  - name: metric_aov
    description: Implements registry metric `aov` (order grain, not line-item grain).
    meta:
      registry_id: aov
      owner: analytics-team
      semantic:
        table: fct_order_items
        expr: "ROUND(SUM(revenue) / COUNT(DISTINCT order_id), 2)"
    columns:
      - name: aov
        tests: [not_null]

  - name: metric_repeat_purchase_rate
    description: Implements registry metric `repeat_purchase_rate`.
    meta:
      registry_id: repeat_purchase_rate
      owner: analytics-team
      semantic:
        table: dim_customers
        note: >
          In this layer the rate is customer-grain: slice it by customer
          attributes such as region. It cannot follow order-level channel or
          category filters the way the registry formula does; use the
          resolver for those.
        expr: "ROUND(100.0 * SUM(CASE WHEN order_count >= 2 THEN 1 ELSE 0 END) / NULLIF(SUM(CASE WHEN order_count > 0 THEN 1 ELSE 0 END), 0), 1)"
    columns:
      - name: repeat_purchase_rate_pct
        tests: [not_null]

  - name: metric_cac_by_channel
    description: >
      Implements registry metric `cac_by_channel`. Spend and acquired-customer
      counts are aggregated to channel grain before joining, so spend is never
      fanned out across customer rows.
    meta:
      registry_id: cac_by_channel
      owner: growth-team
      semantic:
        table: channel_acquisition
        expr: "ROUND(SUM(spend) / NULLIF(SUM(acquired_customers), 0), 2)"
        group_by: {channel: channel}
    columns:
      - name: channel
        tests: [unique, not_null]
      - name: cac
        tests: [not_null]

  - name: metric_ltv_90d
    description: Implements registry metric `ltv_90d`.
    meta:
      registry_id: ltv_90d
      owner: analytics-team
      semantic:
        table: dim_customers
        expr: "ROUND(AVG(revenue_first_90d), 2)"
    columns:
      - name: ltv_90d
        tests: [not_null]

  - name: metric_acquisition_funnel
    description: Implements registry metric `acquisition_funnel`.
    meta:
      registry_id: acquisition_funnel
      owner: growth-team
      semantic:
        table: dim_customers
        expr: "COUNT(customer_id)"
        group_by: {channel: acquisition_channel, outcome: purchase_outcome}
    tests:
      - unique_combination:
          arguments:
            columns: [channel, outcome]

  - name: metric_churn_rate_90d
    description: Implements registry metric `churn_rate_90d`.
    meta:
      registry_id: churn_rate_90d
      owner: analytics-team
      semantic:
        # COUNT(is_churned_90d) counts buyers only: the flag is null for
        # customers who never ordered.
        table: dim_customers
        expr: "ROUND(100.0 * SUM(CASE WHEN is_churned_90d THEN 1 ELSE 0 END) / NULLIF(COUNT(is_churned_90d), 0), 1)"
    columns:
      - name: churn_rate_90d_pct
        tests: [not_null]
